name: Bug report
description: Something in DEX is broken or behaving unexpectedly.
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for the report! Please fill this in so we can reproduce it.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, and what went wrong?
      placeholder: I asked from the phone to find flights; the question showed as text instead of a form.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open DEX
        2. Open ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Desktop app — chat, workspace, settings
        - Phone app
        - Agent and tasks
        - Widgets (questions, cards)
        - Connectors and MCP
        - Windows control
        - Phone ↔ PC sync
        - Other / not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DEX version
      placeholder: e.g. desktop 1.0.0, phone 1.0.34 (Settings › Updates)
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: Windows 11 26200
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: For agent or task issues, the log from Settings › Diagnostics helps. Remove anything private first.
      render: shell
