name: Feature request
description: Suggest an idea or improvement for DEX.
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that's hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Desktop app — chat, workspace, settings
        - Phone app
        - Agent and tasks
        - Widgets (questions, cards)
        - Connectors and MCP
        - Windows control
        - Phone ↔ PC sync
        - Other / not sure
    validations:
      required: true
