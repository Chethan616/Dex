# GitHub secret-scanning exclusions
#
# Phase B fold-in committed the OpenClaw upstream tree (~19k files,
# precursor commit 186df14f). Three of those upstream files trip
# GitHub's secret scanner on FALSE POSITIVES that we should not fix by
# weakening the upstream tests:
#
#   1. dex/core/src/logging/redact.test.ts
#      -- a unit test for the secret redactor. To assert the redactor
#         masks Alibaba LTAI keys / Telegram bot tokens / HuggingFace
#         hf_* tokens / etc., it MUST include realistic-shaped
#         synthetic strings. Each fixture is named *Example*Fake*.
#
#   2. dex/core/src/media/fetch.test.ts
#      -- exercises URL redaction for Telegram bot file URLs. The
#         "bot token" in the test is literally the alphabet
#         "ABCDEFGHIJKLMNOPQRSTUVWXYZabcd". Not a real secret.
#
#   3. dex/core/src/infra/net/undici-runtime.ts
#      -- pure TypeScript type aliases. grepped for LTAI/access-key/
#         secret-key/api-key returns no matches. Scanner false
#         positive; no secret to redact.
#
# Adding new paths here requires the same level of justification: a
# scanner false positive that the source CANNOT remove without breaking
# the test it serves. Real secrets get rotated, not exempted.
#
# Docs: https://docs.github.com/en/code-security/secret-scanning/about-secret-scanning#exempting-paths

paths-ignore:
  # Synthetic fixtures for the redaction-detector unit test suite.
  - "dex/core/src/logging/redact.test.ts"
  - "dex/core/src/logging/redact-*.test.ts"
  # Telegram bot-token / file-URL redaction tests.
  - "dex/core/src/media/fetch.test.ts"
  # Scanner false positive: no secret strings in this type-aliases file.
  - "dex/core/src/infra/net/undici-runtime.ts"
  # Upstream OpenClaw test fixtures that also assert redactor behaviour.
  # Narrow path -- only the explicit secret-redaction test surface.
  - "dex/core/src/logging/redact/**/*.test.ts"
  - "dex/core/src/logging/redact/**/*.fixtures.ts"
