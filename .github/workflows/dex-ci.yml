# Checks for the DEX desktop app.
#
# Lives at the repo root because that is the only place GitHub reads workflows
# from. The fork carries its own copy under desktop/.github/, inherited from
# upstream where the app was the repository root — those never run here, which
# is easy to miss.
#
# Runs on Windows as well as Linux deliberately. Every environment bug that has
# actually cost time in this project has been Windows-specific: PATH stored
# under `Path` rather than `PATH`, cmd.exe stripping quotes, backslashes in
# test fixtures, locked files in the harness directory. A Linux-only pipeline
# would have caught none of them.
name: DEX CI

on:
  push:
    branches: [v3/dex, 'feat/**']
  pull_request:
    branches: [v3/dex]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

permissions:
  contents: read

jobs:
  qa:
    name: Lint, typecheck and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      # Both platforms always report, so a Windows-only failure is visible
      # rather than hidden behind a cancelled Linux run.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: desktop/app/yarn.lock

      # Some transitive dependencies declare ssh:// git URLs, which fail on a
      # runner with no SSH key.
      - name: Rewrite git+ssh to https
        run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/

      # yarn, not npm: yarn.lock is the source of truth here, and npm fights
      # the @visx React 19 peer mismatch unless legacy-peer-deps is set — which
      # then trips npm's optional-native-binding bug for esbuild/rolldown.
      - name: Install dependencies
        working-directory: desktop/app
        run: yarn install --frozen-lockfile

      - name: Lint
        working-directory: desktop/app
        run: yarn lint

      - name: Typecheck
        working-directory: desktop/app
        run: yarn typecheck

      - name: Test
        working-directory: desktop/app
        run: yarn test
