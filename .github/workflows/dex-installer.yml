# Build dex-setup.exe on a clean Windows machine.
#
# This is the check that matters for "works on every system". Locally the
# installer builds against whatever happens to be installed — a particular Node
# from fnm, Git for Windows on D:, an npm cache warmed by months of use. A
# fresh runner has none of that, so if it builds here it builds for someone who
# has only ever downloaded the app.
#
# Deliberately only the build. Lint, typecheck and tests are not run here: they
# belong to development, and gating the installer on them means a test that is
# fragile on a bare runner costs you a release you could otherwise ship. Run
# `yarn qa` locally, or through the build scripts, which do it by default.
#
# The finished installer is attached to the run, so there is always a current
# build to download without anyone making one by hand.
name: DEX installer

on:
  push:
    branches: [v3/dex]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The app pins 20.x || 22.x; yarn refuses outright on anything else.
          node-version: '22'
          cache: yarn
          cache-dependency-path: desktop/app/yarn.lock

      # Some transitive dependencies declare ssh:// git URLs, which cannot be
      # fetched on a runner with no SSH key.
      - name: Rewrite git+ssh to https
        run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/

      # yarn, not npm: yarn.lock is the source of truth here, and npm fights
      # the @visx React 19 peer mismatch unless legacy-peer-deps is set — which
      # then trips npm's optional-native-binding bug for esbuild/rolldown.
      - name: Install dependencies
        working-directory: desktop/app
        run: yarn install --frozen-lockfile

      # Unsigned: there is no certificate in this repo, and forge only signs
      # when WINDOWS_SIGN_WITH_PARAMS is set. Windows SmartScreen will warn on
      # first run — expected, and the reason to sign before wide distribution.
      - name: Build installer
        working-directory: desktop/app
        run: yarn make

      - name: Check the installer is real
        working-directory: desktop/app
        shell: pwsh
        run: |
          $setup = 'out/make/squirrel.windows/x64/dex-setup.exe'
          if (-not (Test-Path $setup)) {
            throw "make reported success but $setup is missing"
          }
          $size = [math]::Round((Get-Item $setup).Length / 1MB, 1)
          Write-Host "dex-setup.exe built ($size MB)"
          # A truncated or half-packaged build still leaves a file behind.
          # Nothing under 50 MB is a packaged Electron app.
          if ($size -lt 50) {
            throw "dex-setup.exe is only $size MB, too small to be a real build"
          }

      # RELEASES and the .nupkg travel with the exe: Squirrel's updater needs
      # all three, and shipping only the exe breaks auto-update in a way that
      # surfaces much later.
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: dex-setup-windows
          path: |
            desktop/app/out/make/squirrel.windows/x64/dex-setup.exe
            desktop/app/out/make/squirrel.windows/x64/RELEASES
            desktop/app/out/make/squirrel.windows/x64/*.nupkg
          if-no-files-found: error
          retention-days: 30
