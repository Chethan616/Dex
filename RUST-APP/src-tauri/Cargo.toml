[package]
name = "dex_shell"
version = "0.1.0"
edition = "2024"
description = "The Dex desktop shell: tray, hotkey, supervisor, and the window the UI runs in."

# Its own workspace: Tauri needs a different profile and dependency set from
# the wasm UI, and mixing them makes every UI build pull in the desktop tree.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dex_protocol = { path = "../crates/dex_protocol" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
