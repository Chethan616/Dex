<!doctype html>
<!--
  Slack OAuth relay. Slack only accepts HTTPS redirect URLs; DEX receives the
  code on a local loopback server. Register this page's URL as the Slack app's
  redirect URL (and as DEX_SLACK_REDIRECT_URI); it forwards the query string,
  unchanged, to DEX on this same computer. Nothing is stored or sent anywhere
  else — the page never leaves the user's browser.
-->
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>DEX — connecting Slack</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 15px/1.5 system-ui, sans-serif; }
  </style>
</head>
<body>
  <p>Handing you back to DEX…</p>
  <script>
    location.replace('http://127.0.0.1:53682/slack/callback' + location.search);
  </script>
</body>
</html>
